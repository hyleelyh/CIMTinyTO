# ==============================================================================
# OpenLane 2 / LibreLane Configuration File: CIMTinyTO Macro Hardening
# Target Shuttle: Tiny Tapeout SKY 26d (SkyWater 130nm / sky130_fd_sc_hd)
# Footprint: 2x2 Tile (~335 um x 226 um, ~73,500 um² usable core area)
# ==============================================================================

DESIGN_NAME: "tt_um_scim_core"

VERILOG_FILES:
  - "dir::src/tt_um_scim_core.v"
  - "dir::src/lfsr8_galois.v"
  - "dir::src/scim_sng_bank.v"
  - "dir::src/scim_pe.v"
  - "dir::src/scim_compressor_42.v"
  - "dir::src/scim_wallace_tree.v"
  - "dir::src/scim_accumulator.v"
  - "dir::src/scim_weight_mem.v"

# Timing constraints
CLOCK_PORT: "clk"
CLOCK_PERIOD: 20.0 # 50 MHz sign-off target
PNR_SDC_FILE: "dir::src/scim_core.sdc"
SIGNOFF_SDC_FILE: "dir::src/scim_core.sdc"

# PDK & Standard Cell Library
pdk: "sky130A"
STD_CELL_LIBRARY: "sky130_fd_sc_hd"

# Synthesis Optimization Strategy
# AREA 2: Multi-pass iterative ABC area mapping for compact macro footprint
SYNTH_STRATEGY: "AREA 2"

# Placement & Density
# Target density 99% cleanly accommodates virtual placement density inside the 2x2 core.
PL_TARGET_DENSITY_PCT: 99
PL_ROUTABILITY_DRIVEN: false
GPL_CELL_PADDING: 0
DPL_CELL_PADDING: 0
# Floorplan & Pin Geometry: Absolute die area and symmetric 81-row core area
# Y in [2.72, 223.04] provides 2.48 um safe clearance at both top and bottom edges
FP_SIZING: "absolute"
DIE_AREA: [0.0, 0.0, 334.88, 225.76]
CORE_AREA: [0.46, 2.72, 334.42, 223.04]
IO_PIN_H_LENGTH: 0.4
IO_PIN_V_LENGTH: 0.4
FP_PDN_SKIPTRIM: false
PDN_VPITCH: 38.87
PDN_MULTILAYER: false

# High-Fanout Net (HFN) & Buffer Insertion Rules
DESIGN_REPAIR_BUFFER_OUTPUT_PORTS: false

# Hold Slack Margins: Enforce positive hold slack (T_slack, hold >= 0.02 ns)
# alongside SDC 200 ps uncertainty, preventing redundant buffer flooding and DPL-0036 overflow.
PL_RESIZER_HOLD_SLACK_MARGIN: 0.02
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.02

# Clock Tree Synthesis (CTS)
RUN_CTS: true
CTS_TARGET_SKEW: 0.200 # Max 200 ps clock skew target
CTS_ROOT_BUFFER: "sky130_fd_sc_hd__clkbuf_16"

# Detailed & Global Routing
RT_MAX_LAYER: "met4"
GRT_ALLOW_CONGESTION: true
GRT_OVERFLOW_ITERS: 100

# Antenna DRC Protection
RUN_ANTENNA_CHECKER: true
DIODE_CELL: "sky130_fd_sc_hd__diode_2"
