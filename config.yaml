# ==============================================================================
# OpenLane 2 Configuration File: CIMTinyTO Macro Hardening
# Target Shuttle: Tiny Tapeout SKY 26d (SkyWater 130nm / sky130_fd_sc_hd)
# Footprint: 2x2 Tile (~335 um x 226 um, ~71,000 um² core area)
# ==============================================================================

DESIGN_NAME: "tt_um_scim_core"

VERILOG_FILES:
  - "dir::src/tt_um_scim_core.v"
  - "dir::src/lfsr8_galois.v"
  - "dir::src/scim_sng_bank.v"
  - "dir::src/scim_pe.v"
  - "dir::src/scim_compressor_42.v"
  - "dir::src/scim_wallace_tree.v"
  - "dir::src/scim_accumulator.v"
  - "dir::src/scim_weight_mem.v"

# Timing constraints
CLOCK_PORT: "clk"
CLOCK_PERIOD: 20.0 # 50 MHz sign-off target

# PDK & Standard Cell Library
pdk: "sky130A"
STD_CELL_LIBRARY: "sky130_fd_sc_hd"

# Synthesis Optimization Strategy
# AREA 1: Prioritize compact standard cells (_1, _2) over oversized cells (_4, _8),
# trimming macro area into the 60%-68% sweet spot with zero weak drive risk.
SYNTH_STRATEGY: "AREA 1"

# Placement & Density
# Target density 65% leaves 35% whitespace for routing channels and buffer insertion.
PL_TARGET_DENSITY: 0.65
PL_BASIC_PLACEMENT: false

# High-Fanout Net (HFN) & Buffer Insertion Rules
MAX_FANOUT_CONSTRAINT: 16
SYNTH_BUFFERING: true
SYNTH_SIZING: true

# Hold Slack Margins
# Physically forces OpenROAD resizer to insert delay buffers on fast paths
# to guarantee T_slack,hold >= 0.10 ns across Fast-Fast (FF) corners.
PL_RESIZER_HOLD_SLACK_MARGIN: 0.10
GLB_RESIZER_HOLD_SLACK_MARGIN: 0.05

# Clock Tree Synthesis (CTS)
RUN_CTS: true
CTS_TARGET_SKEW: 0.200 # Max 200 ps clock skew target
CTS_ROOT_BUFFER: "sky130_fd_sc_hd__clkbuf_16"

# Detailed Routing
RT_MAX_LAYER: "met4"
GRT_ALLOW_CONGESTION: true

# Antenna DRC Protection
RUN_ANTENNA_CHECKER: true
DIODE_CELL: "sky130_fd_sc_hd__diode_2"
