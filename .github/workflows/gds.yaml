name: gds

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gds:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build GDS via OpenLane 2
        uses: TinyTapeout/tt-gds-action@ttsky26d
        timeout-minutes: 50
        with:
          pdk: sky130A

      - name: Inspect Build Artifacts & DRC Reports
        if: always()
        shell: bash
        run: |
          echo "### Build Artifact & DRC Report Inventory" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          find runs/ -type f \( -name "*.drc" -o -name "*.rpt" -o -name "*.def" -o -name "*.odb" -o -name "*.log" \) 2>/dev/null | sort | head -n 50 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Dump Layout & DRC Reports on Failure or Timeout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: layout-debug-dump
          path: |
            runs/
            runs/wokwi/**
            src/*.gds
            src/*.def
            src/*.odb
            src/*.lef
          if-no-files-found: ignore

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttsky26d

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install test dependencies
        run: pip install -r test/requirements.txt

      - name: Gate-Level Simulation Test
        uses: TinyTapeout/tt-gds-action/gl_test@ttsky26d

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - name: Deploy 3D GDS Viewer to GitHub Pages
        uses: TinyTapeout/tt-gds-action/viewer@ttsky26d
