# Tiny Tapeout project information
project:
  title:        "CIMTinyTO: Stochastic & Digital CIM Accelerator"
  author:       "Antigravity & Julius Li"
  discord:      ""      # Discord username for communication (optional)
  description:  "16x16 standard-cell Stochastic and Digital Compute-in-Memory accelerator with unified column delta Wallace trees"
  language:     "Verilog"
  clock_hz:     50000000 # Target master clock: 50 MHz (20 ns period)

  # How many tiles your design occupies?
  # A single tile is ~161x112 um. Stacking 2 tiles vertically (1 column x 2 rows) gives ~161x226 um.
  tiles: "1x2"

  # Top-level Verilog wrapper module name
  top_module:  "tt_um_scim_core"

  # List of synthesizable Verilog source files in ./src
  source_files:
    - "tt_um_scim_core.v"
    - "lfsr8_galois.v"
    - "scim_sng_bank.v"
    - "scim_pe.v"
    - "scim_compressor_42.v"
    - "scim_wallace_tree.v"
    - "scim_accumulator.v"
    - "scim_weight_mem.v"

# Pinout mapping for Tiny Tapeout hardware harness.
# ui[7:0]   = Dedicated 8-bit input bus (activations, config values)
# uo[7:0]   = Dedicated 8-bit output bus (multiplexed accumulator readback)
# uio[3:0]  = Status outputs (busy, done, w_dout loopback, overflow)
# uio[7:4]  = Control inputs (w_din, w_shift_en, wr_act, ctrl_strobe)
pinout:
  # Inputs (ui_in)
  ui[0]: "ui_in[0] (Data / Activation byte bit 0)"
  ui[1]: "ui_in[1] (Data / Activation byte bit 1)"
  ui[2]: "ui_in[2] (Data / Activation byte bit 2)"
  ui[3]: "ui_in[3] (Data / Activation byte bit 3)"
  ui[4]: "ui_in[4] (Data / Activation byte bit 4)"
  ui[5]: "ui_in[5] (Data / Activation byte bit 5)"
  ui[6]: "ui_in[6] (Data / Activation byte bit 6)"
  ui[7]: "ui_in[7] (Data / Activation byte bit 7)"

  # Outputs (uo_out)
  uo[0]: "uo_out[0] (Accumulator readback bit 0)"
  uo[1]: "uo_out[1] (Accumulator readback bit 1)"
  uo[2]: "uo_out[2] (Accumulator readback bit 2)"
  uo[3]: "uo_out[3] (Accumulator readback bit 3)"
  uo[4]: "uo_out[4] (Accumulator readback bit 4)"
  uo[5]: "uo_out[5] (Accumulator readback bit 5)"
  uo[6]: "uo_out[6] (Accumulator readback bit 6)"
  uo[7]: "uo_out[7] (Accumulator readback bit 7)"

  # Bidirectional pins (uio)
  uio[0]: "uio_out[0] (Status: busy flag, active compute)"
  uio[1]: "uio_out[1] (Status: done strobe flag, compute complete)"
  uio[2]: "uio_out[2] (DFT: w_dout serial weight memory loopback)"
  uio[3]: "uio_out[3] (Status: overflow saturation flag)"
  uio[4]: "uio_in[4] (Control: w_din serial weight data in)"
  uio[5]: "uio_in[5] (Control: w_shift_en serial weight shift enable)"
  uio[6]: "uio_in[6] (Control: wr_act activation register write strobe)"
  uio[7]: "uio_in[7] (Control: ctrl_strobe command strobe)"

# Schema version
yaml_version: 6
